<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square, inspired by the card shape in window.svg -->
  <rect width="64" height="64" rx="14" fill="#1c1917"/>

  <!--
    P letterform — evenodd fill creates hollow bowl.
    Outer path: stem (left) + bowl D-shape (right half).
    Inner path: hollow cutout inside the bowl.
    Ref: document outline from file.svg (vertical proportions, clean edges).
  -->
  <path
    fill-rule="evenodd"
    fill="#faf9f7"
    d="M14 52 L14 12 L24 12 C44 12 44 38 24 38 L14 38 Z
       M22 19 C38 19 38 31 22 31 Z"
  />

  <!--
    Prompt cursor — a small blinking-underscore shape.
    Ref: the horizontal text lines inside file.svg.
  -->
  <rect x="42" y="44" width="9" height="4" rx="2" fill="#faf9f7" opacity="0.35"/>
</svg>
